[project]
name = "labubot"
version = "2.0.0"
description = "Buscador de empleo en LinkedIn por HTTP puro, sin navegador ni sesión"
authors = [
    { name = "Leandro Franco", email = "leandro00fr@gmail.com" },
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx==0.28.1",
    "openai==3.26.0",
    "pydantic-settings==2.10.1",
    "beautifulsoup4 ==4.15.0",
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest==8.0.2",
    "ruff==0.12.12",
]

[tool.ruff]
target-version = "py314"
src = ["src"]
force-exclude = true
extend-exclude = ["pyproject.toml"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
